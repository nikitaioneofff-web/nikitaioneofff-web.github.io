<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braille Art Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .upload-area:hover {
            border-color: #0088cc;
            background: #f0f8ff;
        }
        .preview {
            display: none;
            margin: 15px 0;
            text-align: center;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
        }
        .button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .button:hover {
            background: #006699;
        }
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.2;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .copy-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
        }
        .copy-button:hover {
            background: #218838;
        }
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Braille Art</h1>
        
        <div class="upload-area" id="uploadArea">
            📸 Нажми, чтобы выбрать фото
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        
        <div class="preview" id="preview">
            <img id="previewImage" src="" alt="preview">
        </div>
        
        <button class="button" id="convertBtn">Конвертировать</button>
        
        <div class="loader" id="loader">Обработка...</div>
        
        <div id="resultContainer" style="display: none;">
            <div class="result" id="result"></div>
            <button class="copy-button" id="copyBtn">Копировать результат</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const convertBtn = document.getElementById('convertBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('resultContainer');
        const result = document.getElementById('result');
        const copyBtn = document.getElementById('copyBtn');
        
        let currentFile = null;

        // Загрузка по клику
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    preview.style.display = 'block';
                    resultContainer.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#0088cc';
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    preview.style.display = 'block';
                    resultContainer.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Конвертация
        convertBtn.addEventListener('click', async () => {
            if (!currentFile) {
                alert('Выберите фото');
                return;
            }

            convertBtn.disabled = true;
            loader.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                const img = new Image();
                const reader = new FileReader();
                
                await new Promise((resolve) => {
                    reader.onload = (e) => {
                        img.onload = resolve;
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(currentFile);
                });

                // СОЗДАЁМ МАЛЕНЬКОЕ ИЗОБРАЖЕНИЕ
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Устанавливаем маленький размер - всего 40 символов в ширину
                const charWidth = 40;
                const charHeight = Math.floor(charWidth * (img.height / img.width) * 0.5);
                
                canvas.width = charWidth * 2;
                canvas.height = charHeight * 4;
                
                // Рисуем изображение очень маленьким
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Получаем пиксели
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Конвертируем в чёрно-белое (резко)
                const pixels = [];
                for (let i = 0; i < data.length; i += 4) {
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    pixels.push(brightness < 128 ? 1 : 0);
                }
                
                // Создаём символы Брайля
                let braille = '';
                for (let y = 0; y < canvas.height; y += 4) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let code = 0x2800;
                        
                        const positions = [
                            [0,0], [1,0], [2,0], [0,1],
                            [1,1], [2,1], [3,0], [3,1]
                        ];
                        
                        for (let i = 0; i < 8; i++) {
                            const py = y + positions[i][0];
                            const px = x + positions[i][1];
                            
                            if (py < canvas.height && px < canvas.width) {
                                if (pixels[py * canvas.width + px] === 1) {
                                    code |= (1 << i);
                                }
                            }
                        }
                        
                        braille += String.fromCharCode(code);
                    }
                    braille += '\n';
                }
                
                result.textContent = braille;
                resultContainer.style.display = 'block';
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                convertBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        // Копирование
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(result.textContent).then(() => {
                alert('Скопировано! Можно вставить в Telegram');
            });
        });
    </script>
</body>
</html>
