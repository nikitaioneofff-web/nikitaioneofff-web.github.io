<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Braille Art Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }
        .upload {
            border: 2px dashed #ccc;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            background: #fafafa;
            transition: all 0.3s;
        }
        .upload:hover {
            border-color: #0088cc;
            background: #f0f8ff;
        }
        .preview {
            display: none;
            text-align: center;
            margin: 15px 0;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
        }
        .settings {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #e9ecef;
        }
        .setting-item {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .setting-item label {
            font-weight: 500;
            color: #495057;
            min-width: 100px;
        }
        .setting-item select, .setting-item input {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            flex: 1;
        }
        .setting-item input[type="range"] {
            padding: 0;
        }
        .value-display {
            min-width: 45px;
            text-align: center;
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #006699;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            background: #1a1a1a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #333;
        }
        .copy {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .copy:hover {
            background: #218838;
        }
        .hidden {
            display: none;
        }
        .note {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎨 Braille Art Converter</h2>
        
        <div class="upload" id="upload">
            📸 Нажми, чтобы выбрать фото
            <input type="file" id="file" accept="image/*" style="display: none">
        </div>
        
        <div class="preview" id="preview">
            <img id="imgPreview" src="">
        </div>

        <div class="settings">
            <h3 style="margin-top: 0; color: #495057;">⚙️ Настройки</h3>
            
            <div class="setting-item">
                <label>Режим:</label>
                <select id="modeSelect">
                    <option value="dark">🌑 Тёмное = ⣿ (обычный)</option>
                    <option value="light">☀️ Светлое = ⣿ (инверсный)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Яркость:</label>
                <input type="range" id="thresholdSlider" min="50" max="220" value="140">
                <span class="value-display" id="thresholdValue">140</span>
            </div>

            <div class="setting-item">
                <label>Ширина:</label>
                <select id="widthSelect">
                    <option value="22">📱 22 (телефон)</option>
                    <option value="28">💻 28 (планшет)</option>
                    <option value="35">🖥️ 35 (компьютер)</option>
                </select>
            </div>
        </div>
        
        <button class="btn" id="convert">Конвертировать</button>
        
        <div id="resultBlock" class="hidden">
            <div class="result" id="result"></div>
            <button class="copy" id="copy">📋 Копировать</button>
            <div class="note">✓ Нажми копировать и вставь в Telegram</div>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const fileInput = document.getElementById('file');
        const preview = document.getElementById('preview');
        const imgPreview = document.getElementById('imgPreview');
        const convertBtn = document.getElementById('convert');
        const resultBlock = document.getElementById('resultBlock');
        const result = document.getElementById('result');
        const copyBtn = document.getElementById('copy');
        const modeSelect = document.getElementById('modeSelect');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');
        const widthSelect = document.getElementById('widthSelect');
        
        let currentFile = null;

        // Отображение значения яркости
        thresholdSlider.addEventListener('input', () => {
            thresholdValue.textContent = thresholdSlider.value;
        });

        upload.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgPreview.src = e.target.result;
                    preview.style.display = 'block';
                    resultBlock.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        upload.ondragover = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#0088cc';
            upload.style.background = '#f0f8ff';
        };

        upload.ondragleave = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#ccc';
            upload.style.background = '#fafafa';
        };

        upload.ondrop = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#ccc';
            upload.style.background = '#fafafa';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgPreview.src = e.target.result;
                    preview.style.display = 'block';
                    resultBlock.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                alert('Пожалуйста, выберите изображение');
            }
        };

        convertBtn.onclick = async () => {
            if (!currentFile) {
                alert('Сначала выберите фото');
                return;
            }

            convertBtn.disabled = true;
            convertBtn.textContent = '⏳ Обработка...';

            try {
                const img = new Image();
                const reader = new FileReader();
                
                await new Promise((resolve) => {
                    reader.onload = (e) => {
                        img.onload = resolve;
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(currentFile);
                });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Получаем выбранную ширину
                const width = parseInt(widthSelect.value);
                const height = Math.floor(width * (img.height / img.width) * 0.5);
                
                canvas.width = width * 2;
                canvas.height = height * 4;
                
                // Включаем сглаживание
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Получаем яркость
                const gray = [];
                for (let i = 0; i < data.length; i += 4) {
                    const g = (data[i] + data[i+1] + data[i+2]) / 3;
                    gray.push(g);
                }
                
                // Нормализация яркости
                const min = Math.min(...gray);
                const max = Math.max(...gray);
                const range = max - min;
                if (range > 0) {
                    for (let i = 0; i < gray.length; i++) {
                        gray[i] = ((gray[i] - min) / range) * 255;
                    }
                }
                
                // Получаем порог яркости и режим
                const threshold = parseInt(thresholdSlider.value);
                const mode = modeSelect.value; // 'dark' или 'light'
                
                let braille = '';
                
                for (let y = 0; y < canvas.height; y += 4) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let code = 0x2800;
                        
                        const dots = [
                            [0,0], [1,0], [2,0], [0,1],
                            [1,1], [2,1], [3,0], [3,1]
                        ];
                        
                        for (let i = 0; i < 8; i++) {
                            const py = y + dots[i][0];
                            const px = x + dots[i][1];
                            
                            if (py < canvas.height && px < canvas.width) {
                                const pixelValue = gray[py * canvas.width + px];
                                
                                // В зависимости от режима
                                if (mode === 'dark') {
                                    // Тёмное = точки (обычный режим)
                                    if (pixelValue < threshold) {
                                        code |= (1 << i);
                                    }
                                } else {
                                    // Светлое = точки (инверсный режим)
                                    if (pixelValue > threshold) {
                                        code |= (1 << i);
                                    }
                                }
                            }
                        }
                        
                        braille += String.fromCharCode(code);
                    }
                    braille += '\n';
                }
                
                result.textContent = braille;
                resultBlock.classList.remove('hidden');
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
            
            convertBtn.disabled = false;
            convertBtn.textContent = 'Конвертировать';
        };

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(result.textContent).then(() => {
                alert('✅ Скопировано! Теперь вставь в Telegram');
            }).catch(() => {
                alert('❌ Не удалось скопировать. Выдели текст вручную и нажми Ctrl+C');
            });
        };
    </script>
</body>
</html>
