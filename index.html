<script>
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const preview = document.getElementById('preview');
const previewImage = document.getElementById('previewImage');
const convertBtn = document.getElementById('convertBtn');
const loader = document.getElementById('loader');
const resultContainer = document.getElementById('resultContainer');
const result = document.getElementById('result');
const copyBtn = document.getElementById('copyBtn');

let currentFile = null;

uploadArea.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        currentFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImage.src = e.target.result;
            preview.style.display = 'block';
            resultContainer.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});

uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#0088cc';
});

uploadArea.addEventListener('dragleave', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#ccc';
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#ccc';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        currentFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImage.src = e.target.result;
            preview.style.display = 'block';
            resultContainer.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});

convertBtn.addEventListener('click', async () => {
    if (!currentFile) {
        alert('Выберите фото');
        return;
    }

    convertBtn.disabled = true;
    loader.style.display = 'block';
    resultContainer.style.display = 'none';

    try {
        const img = new Image();
        const reader = new FileReader();
        
        await new Promise((resolve) => {
            reader.onload = (e) => {
                img.onload = resolve;
                img.src = e.target.result;
            };
            reader.readAsDataURL(currentFile);
        });

        // РАЗМЕР: 60 символов в ширину
        const charWidth = 60;
        const charHeight = Math.floor(charWidth * (img.height / img.width) * 0.5);
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = charWidth * 2;
        canvas.height = charHeight * 4;
        
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        // Получаем яркость (0-255)
        const brightness = [];
        for (let i = 0; i < data.length; i += 4) {
            const b = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            brightness.push(b);
        }
        
        // Нормализуем яркость (растягиваем диапазон)
        const min = Math.min(...brightness);
        const max = Math.max(...brightness);
        const range = max - min;
        
        const normalized = brightness.map(b => 
            range > 0 ? ((b - min) / range * 255) : 128
        );
        
        // Более высокий порог для светлых участков
        const threshold = 160;
        
        // Создаём символы Брайля с градиентом
        let braille = '';
        for (let y = 0; y < canvas.height; y += 4) {
            for (let x = 0; x < canvas.width; x += 2) {
                let code = 0x2800;
                
                const positions = [
                    [0,0], [1,0], [2,0], [0,1],
                    [1,1], [2,1], [3,0], [3,1]
                ];
                
                for (let i = 0; i < 8; i++) {
                    const py = y + positions[i][0];
                    const px = x + positions[i][1];
                    
                    if (py < canvas.height && px < canvas.width) {
                        const b = normalized[py * canvas.width + px];
                        if (b < threshold) {
                            code |= (1 << i);
                        }
                    }
                }
                
                braille += String.fromCharCode(code);
            }
            braille += '\n';
        }
        
        result.textContent = braille;
        resultContainer.style.display = 'block';
        
    } catch (error) {
        alert('Ошибка: ' + error.message);
    } finally {
        convertBtn.disabled = false;
        loader.style.display = 'none';
    }
});

copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(result.textContent).then(() => {
        alert('Скопировано!');
    });
});
</script>
