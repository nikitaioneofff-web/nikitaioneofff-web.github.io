<script>
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const preview = document.getElementById('preview');
    const previewImage = document.getElementById('previewImage');
    const convertBtn = document.getElementById('convertBtn');
    const loader = document.getElementById('loader');
    const resultContainer = document.getElementById('resultContainer');
    const result = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');
    
    let currentFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
                resultContainer.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#0088cc';
    });

    uploadArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#ccc';
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#ccc';
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
                resultContainer.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    convertBtn.addEventListener('click', async () => {
        if (!currentFile) {
            alert('Выберите фото');
            return;
        }

        convertBtn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';

        try {
            const img = new Image();
            const reader = new FileReader();
            
            await new Promise((resolve) => {
                reader.onload = (e) => {
                    img.onload = resolve;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(currentFile);
            });

            // РАЗМЕР: 60 символов в ширину (можно менять)
            const charWidth = 60;
            const charHeight = Math.floor(charWidth * (img.height / img.width) * 0.5);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = charWidth * 2;
            canvas.height = charHeight * 4;
            
            // Рисуем с высоким качеством
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Получаем пиксели
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Анализируем яркость изображения
            let minBrightness = 255;
            let maxBrightness = 0;
            const brightnessValues = [];
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                brightnessValues.push(brightness);
                minBrightness = Math.min(minBrightness, brightness);
                maxBrightness = Math.max(maxBrightness, brightness);
            }
            
            // Нормализуем яркость (растягиваем на весь диапазон)
            const range = maxBrightness - minBrightness;
            const normalized = brightnessValues.map(b => 
                range > 0 ? ((b - minBrightness) / range) * 255 : 128
            );
            
            // Создаём символы Брайля с плавными переходами
            let braille = '';
            for (let y = 0; y < canvas.height; y += 4) {
                for (let x = 0; x < canvas.width; x += 2) {
                    let code = 0x2800;
                    
                    const positions = [
                        [0,0], [1,0], [2,0], [0,1],
                        [1,1], [2,1], [3,0], [3,1]
                    ];
                    
                    // Собираем 8 пикселей для символа
                    for (let i = 0; i < 8; i++) {
                        const py = y + positions[i][0];
                        const px = x + positions[i][1];
                        
                        if (py < canvas.height && px < canvas.width) {
                            const idx = py * canvas.width + px;
                            const brightness = normalized[idx];
                            
                            // Используем несколько порогов для плавности
                            if (brightness < 64) code |= (1 << i);      // очень темно
                            else if (brightness < 128 && i % 2 === 0) code |= (1 << i); // средне темно (только чётные точки)
                            else if (brightness < 192 && i % 3 === 0) code |= (1 << i); // чуть темно (каждая третья)
                            // яркие - оставляем пустыми
                        }
                    }
                    
                    braille += String.fromCharCode(code);
                }
                braille += '\n';
            }
            
            result.textContent = braille;
            resultContainer.style.display = 'block';
            
        } catch (error) {
            alert('Ошибка: ' + error.message);
        } finally {
            convertBtn.disabled = false;
            loader.style.display = 'none';
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(result.textContent).then(() => {
            alert('Скопировано!');
        });
    });
</script>
