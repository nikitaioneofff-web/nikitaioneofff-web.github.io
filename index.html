<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Braille Art</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }
        .upload {
            border: 2px dashed #ccc;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            background: #fafafa;
            transition: all 0.3s;
        }
        .upload:hover {
            border-color: #0088cc;
            background: #f0f8ff;
        }
        .preview {
            display: none;
            text-align: center;
            margin: 15px 0;
        }
        .preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
        }
        .btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #006699;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            background: #1a1a1a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid #333;
        }
        .copy {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .copy:hover {
            background: #218838;
        }
        .hidden {
            display: none;
        }
        .note {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎨 Braille Art</h2>
        
        <div class="upload" id="upload">
            📸 Нажми, чтобы выбрать фото
            <input type="file" id="file" accept="image/*" style="display: none">
        </div>
        
        <div class="preview" id="preview">
            <img id="imgPreview" src="">
        </div>
        
        <button class="btn" id="convert">Конвертировать</button>
        
        <div id="resultBlock" class="hidden">
            <div class="result" id="result"></div>
            <button class="copy" id="copy">📋 Копировать</button>
            <div class="note">✓ Оптимально для Telegram</div>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const fileInput = document.getElementById('file');
        const preview = document.getElementById('preview');
        const imgPreview = document.getElementById('imgPreview');
        const convertBtn = document.getElementById('convert');
        const resultBlock = document.getElementById('resultBlock');
        const result = document.getElementById('result');
        const copyBtn = document.getElementById('copy');
        
        let currentFile = null;

        upload.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgPreview.src = e.target.result;
                    preview.style.display = 'block';
                    resultBlock.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        upload.ondragover = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#0088cc';
            upload.style.background = '#f0f8ff';
        };

        upload.ondragleave = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#ccc';
            upload.style.background = '#fafafa';
        };

        upload.ondrop = (e) => {
            e.preventDefault();
            upload.style.borderColor = '#ccc';
            upload.style.background = '#fafafa';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgPreview.src = e.target.result;
                    preview.style.display = 'block';
                    resultBlock.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                alert('Пожалуйста, выберите изображение');
            }
        };

        convertBtn.onclick = async () => {
            if (!currentFile) {
                alert('Сначала выберите фото');
                return;
            }

            convertBtn.disabled = true;
            convertBtn.textContent = '⏳ Обработка...';

            try {
                const img = new Image();
                const reader = new FileReader();
                
                await new Promise((resolve) => {
                    reader.onload = (e) => {
                        img.onload = resolve;
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(currentFile);
                });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // ✅ ШИРИНА: 22 символа (идеально для телефона)
                const width = 22;
                const height = Math.floor(width * (img.height / img.width) * 0.5);
                
                canvas.width = width * 2;
                canvas.height = height * 4;
                
                // Включаем сглаживание
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Получаем яркость
                const gray = [];
                for (let i = 0; i < data.length; i += 4) {
                    const g = (data[i] + data[i+1] + data[i+2]) / 3;
                    gray.push(g);
                }
                
                // Нормализация с автоподбором контраста
                const min = Math.min(...gray);
                const max = Math.max(...gray);
                const range = max - min;
                
                // Избегаем деления на ноль
                if (range > 0) {
                    for (let i = 0; i < gray.length; i++) {
                        // Растягиваем на весь диапазон 0-255
                        gray[i] = ((gray[i] - min) / range) * 255;
                    }
                }
                
                // ✅ ПЛАВНЫЙ ПОРОГ: используем несколько уровней
                let braille = '';
                
                for (let y = 0; y < canvas.height; y += 4) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        let code = 0x2800;
                        
                        const dots = [
                            [0,0], [1,0], [2,0], [0,1],
                            [1,1], [2,1], [3,0], [3,1]
                        ];
                        
                        // Собираем яркость 8 пикселей
                        const pixels = [];
                        for (let i = 0; i < 8; i++) {
                            const py = y + dots[i][0];
                            const px = x + dots[i][1];
                            
                            if (py < canvas.height && px < canvas.width) {
                                pixels.push(gray[py * canvas.width + px]);
                            } else {
                                pixels.push(255); // Белый за границами
                            }
                        }
                        
                        // Средняя яркость блока
                        const avg = pixels.reduce((a, b) => a + b, 0) / 8;
                        
                        // Динамический порог (чем выше avg, тем больше точек)
                        for (let i = 0; i < 8; i++) {
                            // Каждая точка сравнивается со средним по блоку
                            if (pixels[i] < avg * 0.9) { // Немного темнее среднего
                                code |= (1 << i);
                            }
                        }
                        
                        braille += String.fromCharCode(code);
                    }
                    braille += '\n';
                }
                
                result.textContent = braille;
                resultBlock.classList.remove('hidden');
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
            
            convertBtn.disabled = false;
            convertBtn.textContent = 'Конвертировать';
        };

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(result.textContent).then(() => {
                alert('✅ Скопировано! Теперь вставь в Telegram');
            }).catch(() => {
                alert('❌ Не удалось скопировать. Выдели текст вручную и нажми Ctrl+C');
            });
        };
    </script>
</body>
</html>
