<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    max-width: 600px;
    width: 100%;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 28px;
    color: #1a1a1a;
    margin-top: 0;
    margin-bottom: 10px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 16px;
  }
  .upload-area {
    border: 2px dashed #ccc;
    border-radius: 15px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: #fafafa;
  }
  .upload-area:hover {
    border-color: #0088cc;
    background: #f0f8ff;
  }
  .upload-area svg {
    width: 50px;
    height: 50px;
    fill: #0088cc;
    margin-bottom: 15px;
  }
  .upload-area input {
    display: none;
  }
  .button {
    background: #0088cc;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin: 20px 0;
    transition: background 0.3s;
  }
  .button:hover {
    background: #006699;
  }
  .button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .preview {
    margin: 20px 0;
    display: none;
  }
  .preview img {
    max-width: 100%;
    border-radius: 10px;
    max-height: 200px;
    margin: 0 auto;
    display: block;
  }
  .result {
    background: #1a1a1a;
    color: #fff;
    padding: 20px;
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 20px;
    border: 1px solid #333;
  }
  .result-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #1a1a1a;
  }
  .copy-button {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }
  .copy-button:hover {
    background: #218838;
  }
  .loader {
    display: none;
    text-align: center;
    margin: 20px 0;
  }
  .loader svg {
    width: 40px;
    height: 40px;
    animation: rotate 2s linear infinite;
  }
  @keyframes rotate {
    100% { transform: rotate(360deg); }
  }
  .info-box {
    background: #e7f3ff;
    border-left: 4px solid #0088cc;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 14px;
    color: #004466;
  }
</style>

<div class="container">
  <h1>🎨 Braille Art Converter</h1>
  <div class="subtitle">Преврати любое фото в рисунок из символов Брайля</div>
  
  <div class="info-box">
    <strong>📱 Как это работает:</strong><br>
    1. Выбери фото<br>
    2. Нажми "Конвертировать"<br>
    3. Скопируй результат<br>
    4. Вставь куда хочешь (Telegram, соцсети)
  </div>
  
  <div class="upload-area" onclick="document.getElementById('fileInput').click()">
    <svg viewBox="0 0 24 24">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
    <div><strong>Нажми, чтобы выбрать фото</strong></div>
    <div style="color: #666; margin-top: 5px; font-size: 14px;">или перетащи его сюда</div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>
  
  <div class="preview" id="preview">
    <img id="previewImage" src="" alt="Preview">
  </div>
  
  <button class="button" id="convertBtn" onclick="convertImage()">Конвертировать</button>
  
  <div class="loader" id="loader">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="#0088cc" stroke-width="2" fill="none" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" values="50;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div style="margin-top: 10px;">Обрабатываем...</div>
  </div>
  
  <div id="resultSection" style="display: none;">
    <div class="result-title">✨ Результат (скопируй текст):</div>
    <div class="result" id="result"></div>
    <button class="copy-button" onclick="copyResult()">📋 Копировать результат</button>
  </div>
</div>

<script>
let currentImageFile = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    currentImageFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImage').src = e.target.result;
      document.getElementById('preview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

// Drag and drop
const uploadArea = document.querySelector('.upload-area');
uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = '#0088cc';
  uploadArea.style.background = '#f0f8ff';
});

uploadArea.addEventListener('dragleave', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = '#ccc';
  uploadArea.style.background = '#fafafa';
});

uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = '#ccc';
  uploadArea.style.background = '#fafafa';
  
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    currentImageFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImage').src = e.target.result;
      document.getElementById('preview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  } else {
    alert('Пожалуйста, выберите изображение');
  }
});

async function convertImage() {
  if (!currentImageFile) {
    alert('Сначала выберите фото');
    return;
  }
  
  const convertBtn = document.getElementById('convertBtn');
  const loader = document.getElementById('loader');
  const resultSection = document.getElementById('resultSection');
  
  convertBtn.disabled = true;
  loader.style.display = 'block';
  resultSection.style.display = 'none';
  
  try {
    // Создаём canvas для обработки
    const img = new Image();
    const reader = new FileReader();
    
    await new Promise((resolve, reject) => {
      reader.onload = function(e) {
        img.onload = resolve;
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.readAsDataURL(currentImageFile);
    });
    
    // Настройки размера
    const width = 80; // ширина в символах
    const height = Math.floor(img.height * width / img.width / 2) * 4;
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = width * 2;
    canvas.height = height * 4;
    
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    // Конвертируем в оттенки серого
    const gray = [];
    for (let i = 0; i < data.length; i += 4) {
      gray.push(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    }
    
    // Превращаем в символы Брайля
    let result = '';
    for (let y = 0; y < canvas.height; y += 4) {
      for (let x = 0; x < canvas.width; x += 2) {
        let code = 0x2800;
        
        // Позиции точек в символе Брайля (8 точек)
        const positions = [
          [0, 0], [1, 0], [2, 0], [0, 1],
          [1, 1], [2, 1], [3, 0], [3, 1]
        ];
        
        for (let i = 0; i < 8; i++) {
          const py = y + positions[i][0];
          const px = x + positions[i][1];
          
          if (py < canvas.height && px < canvas.width) {
            const pixel = gray[py * canvas.width + px];
            if (pixel < 128) { // порог яркости
              code |= (1 << i);
            }
          }
        }
        
        result += String.fromCharCode(code);
      }
      result += '\n';
    }
    
    document.getElementById('result').textContent = result;
    resultSection.style.display = 'block';
    
  } catch (error) {
    alert('Ошибка при обработке: ' + error.message);
  } finally {
    convertBtn.disabled = false;
    loader.style.display = 'none';
  }
}

function copyResult() {
  const resultText = document.getElementById('result').textContent;
  navigator.clipboard.writeText(resultText).then(() => {
    alert('Результат скопирован! Можно вставлять в Telegram');
  }).catch(() => {
    alert('Не удалось скопировать, выдели текст вручную');
  });
}
</script>
