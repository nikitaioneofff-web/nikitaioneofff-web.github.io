<script>
let currentImageFile = null;

// Настройки качества
const CONFIG = {
    maxWidth: 60,           // ширина в символах (меньше = мельче узор)
    contrast: 1.2,          // контрастность (>1 = темнее)
    brightness: -10,        // яркость (-255 до 255)
    threshold: 140,         // порог (0-255, меньше = светлее)
    dithering: true         // добавлять шум для плавности
};

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        currentImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImage').src = e.target.result;
            document.getElementById('preview').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});

// Drag and drop
const uploadArea = document.querySelector('.upload-area');
uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#0088cc';
    uploadArea.style.background = '#f0f8ff';
});

uploadArea.addEventListener('dragleave', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#ccc';
    uploadArea.style.background = '#fafafa';
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#ccc';
    uploadArea.style.background = '#fafafa';
    
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        currentImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImage').src = e.target.result;
            document.getElementById('preview').style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        alert('Пожалуйста, выберите изображение');
    }
});

async function convertImage() {
    if (!currentImageFile) {
        alert('Сначала выберите фото');
        return;
    }
    
    const convertBtn = document.getElementById('convertBtn');
    const loader = document.getElementById('loader');
    const resultSection = document.getElementById('resultSection');
    
    convertBtn.disabled = true;
    loader.style.display = 'block';
    resultSection.style.display = 'none';
    
    try {
        // Загружаем изображение
        const img = new Image();
        const reader = new FileReader();
        
        await new Promise((resolve, reject) => {
            reader.onload = function(e) {
                img.onload = resolve;
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.readAsDataURL(currentImageFile);
        });
        
        // Рассчитываем размеры с сохранением пропорций
        const aspectRatio = img.height / img.width;
        const width = CONFIG.maxWidth;
        const height = Math.floor(width * aspectRatio * 0.5);
        
        // Создаём canvas нужного размера
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = width * 2;
        canvas.height = height * 4;
        
        // Рисуем изображение с улучшенным сглаживанием
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Получаем данные пикселей
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        // Конвертируем в оттенки серого с настройками
        const gray = [];
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i];
            let g = data[i+1];
            let b = data[i+2];
            
            // Формула яркости с контрастом
            let luminance = 0.299 * r + 0.587 * g + 0.114 * b;
            
            // Применяем контраст и яркость
            luminance = (luminance - 128) * CONFIG.contrast + 128 + CONFIG.brightness;
            
            // Ограничиваем диапазон
            luminance = Math.max(0, Math.min(255, luminance));
            
            gray.push(luminance);
        }
        
        // Применяем дизеринг (Флойд-Стейнберг) если включено
        if (CONFIG.dithering) {
            const width2 = canvas.width;
            const height2 = canvas.height;
            const grayWithDither = [...gray];
            
            for (let y = 0; y < height2 - 1; y++) {
                for (let x = 1; x < width2 - 1; x++) {
                    const i = y * width2 + x;
                    const oldPixel = grayWithDither[i];
                    const newPixel = oldPixel < CONFIG.threshold ? 0 : 255;
                    grayWithDither[i] = newPixel;
                    
                    const error = oldPixel - newPixel;
                    
                    // Распределяем ошибку
                    if (x + 1 < width2) grayWithDither[i + 1] += error * 7/16;
                    if (y + 1 < height2) {
                        grayWithDither[i + width2 - 1] += error * 3/16;
                        grayWithDither[i + width2] += error * 5/16;
                        if (x + 1 < width2) grayWithDither[i + width2 + 1] += error * 1/16;
                    }
                }
            }
            
            // Используем обработанный массив
            for (let i = 0; i < gray.length; i++) {
                gray[i] = grayWithDither[i];
            }
        }
        
        // Превращаем в символы Брайля
        let result = '';
        for (let y = 0; y < canvas.height; y += 4) {
            for (let x = 0; x < canvas.width; x += 2) {
                let code = 0x2800;
                
                // Позиции точек в символе Брайля
                const positions = [
                    [0, 0], [1, 0], [2, 0], [0, 1],
                    [1, 1], [2, 1], [3, 0], [3, 1]
                ];
                
                for (let i = 0; i < 8; i++) {
                    const py = y + positions[i][0];
                    const px = x + positions[i][1];
                    
                    if (py < canvas.height && px < canvas.width) {
                        const pixel = gray[py * canvas.width + px];
                        if (pixel < CONFIG.threshold) {
                            code |= (1 << i);
                        }
                    }
                }
                
                result += String.fromCharCode(code);
            }
            result += '\n';
        }
        
        document.getElementById('result').textContent = result;
        resultSection.style.display = 'block';
        
    } catch (error) {
        alert('Ошибка при обработке: ' + error.message);
    } finally {
        convertBtn.disabled = false;
        loader.style.display = 'none';
    }
}

function copyResult() {
    const resultText = document.getElementById('result').textContent;
    navigator.clipboard.writeText(resultText).then(() => {
        alert('Результат скопирован! Можно вставлять в Telegram');
    }).catch(() => {
        alert('Не удалось скопировать, выдели текст вручную');
    });
}
</script>
